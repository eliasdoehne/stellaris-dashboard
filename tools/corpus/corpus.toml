# Test corpus of observer-run saves, stored in a private GCS bucket (see docs/test-corpus.md).
# Replaced as a whole when the supported game version changes.

version = "4.5.2"
bucket = "stellaris-corpus-fa4b5b4a"  # overridden by STELLARIS_CORPUS_BUCKET

# Base sample: the first save, the last save and the first save of every `interval_years`-th year.
interval_years = 10

# `events` are in-game months (YYYY.MM) with a transition worth testing; the last save before the
# month and the first save after it are added, so importing them in order crosses the transition.
# `notes` are relative to the scratch folder of the machine that builds the corpus.

[[game]]
id = "unitednationsofearth2_-629118313"
until = "2320.01"  # ran to 2502; the later saves are large and add little
notes = ["observer-run-2026-10/PLAYTHROUGH.md", "observer-run-2026-10/game_setups.json"]
events = []

[[game]]
id = "earthcustodianship_-1585140336"
notes = ["observer-run-4/RUN.md", "observer-run-4/game_setup.json"]
events = [
    "2283.01",  # Voidworm Plague starts
    "2285.02",  # Great Khan rises
    "2291.07",  # Voidworm Plague ends
    "2297.12",  # country 0 destroyed
    "2304.04",  # Khan defeated
    "2355.07",  # fallen empire awakens
]

