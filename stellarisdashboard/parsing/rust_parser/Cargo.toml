[package]
name = "rust_parser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_parser"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
# nom is held at 7: moving to nom 8 requires a rewrite of parser.rs.
nom = "7.1.1"
# Saves are deflate-compressed zips, so only the (decompressing) deflate backend is enabled.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1.0"
chrono = "0.4"
serde = { version = "1.0.143", features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

