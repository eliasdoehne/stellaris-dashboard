{# 18px line icons for the shell; stroke follows the link colour. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "graphs" -%}
<path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/>
{%- elif name == "galaxy" -%}
<circle cx="12" cy="12" r="2.2"/><path d="M12 4c5 0 8 3.2 8 6.5"/><path d="M12 20c-5 0-8-3.2-8-6.5"/><path d="M4.5 9.5C5.5 6 8.5 4.5 12 4"/><path d="M19.5 14.5c-1 3.5-4 5-7.5 5.5"/>
{%- elif name == "ledger" -%}
<path d="M6 4h12v16H6z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/>
{%- elif name == "codex" -%}
<path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/>
{%- elif name == "games" -%}
<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
{%- elif name == "import" -%}
<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v3h16v-3"/>
{%- elif name == "settings" -%}
<path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h4"/><path d="M12 17h8"/><circle cx="10" cy="17" r="2"/>
{%- elif name == "external" -%}
<path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v5H5V6h5"/>
{%- elif name == "menu" -%}
<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
{%- elif name == "collapse" -%}
<path d="M15 6l-6 6 6 6"/>
{%- elif name == "chevron" -%}
<path d="M7 10l5 5 5-5"/>
{%- endif -%}
</svg>
{%- endmacro %}
